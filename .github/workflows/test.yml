name: TradeLang
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 1'
jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Build documentation
        run: uv run --no-project --python 3.12 --with-requirements docs/requirements.txt mkdocs build --strict
      - run: uv sync --locked --extra api
      - run: uv run --extra api ruff check src tests scripts
      - run: uv run --extra api mypy src
      - run: uv run --locked --extra api pytest
      - run: uv build
      - name: Verify the installed wheel and record dependency evidence
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/candidate" uv sync --locked --extra api --no-install-project
          uv pip install --no-deps --python "$RUNNER_TEMP/candidate/bin/python" dist/*.whl
          PATH="$RUNNER_TEMP/candidate/bin:$PATH" "$RUNNER_TEMP/candidate/bin/python" -m pytest
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/production" uv sync --locked --no-dev --extra api --no-install-project
          uv pip install --no-deps --python "$RUNNER_TEMP/production/bin/python" dist/*.whl
          "$RUNNER_TEMP/production/bin/tradelang" validate docs/fixtures/core.trade
          "$RUNNER_TEMP/production/bin/python" scripts/release_inventory.py release-evidence
          uvx --from pip-audit==2.10.0 pip-audit --version | tee release-evidence/scanner.txt
          uvx --from pip-audit==2.10.0 pip-audit --strict --no-deps --disable-pip -r release-evidence/requirements.txt -f json -o release-evidence/vulnerabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-dependency-evidence
          path: release-evidence/
  language-deep:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADELANG_TEST_PROFILE: language-deep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra api
      - name: Run deeper conformance, property, and fuzz checks
        run: |
          set -o pipefail
          uv run --locked --extra api python -c 'import hypothesis, os; print("Hypothesis", hypothesis.__version__, os.environ["TRADELANG_TEST_PROFILE"])' | tee language-deep.log
          uv run --locked --extra api pytest tests/conformance tests/property tests/fuzz tests/test_registry_parity.py tests/test_execution_contract.py tests/test_identity_protocol.py tests/test_indicator_expansion.py tests/test_indicator_references.py tests/test_volume_profile.py --hypothesis-show-statistics --junitxml=language-deep.xml | tee -a language-deep.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-deep-evidence
          path: |
            language-deep.log
            language-deep.xml
