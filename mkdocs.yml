site_name: TradeLang
site_description: Write typed trading strategies and backtest them on historical candles.
repo_name: alwank/TradeLang
repo_url: https://github.com/alwank/TradeLang

theme:
  name: material
  font: false
  icon:
    logo: material/chart-line
    repo: fontawesome/brands/github
  palette:
    # The first palette is used until the reader chooses a mode.
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - toc.follow

extra_css:
  - stylesheets/tradelang.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
      - Run your first backtest: quickstart.md
      - Write a strategy: writing-strategies.md
      - Example strategies: example-strategies.md
  - How-to guides:
      - Use your own candle data: use-your-own-candles.md
      - Apply common strategy patterns: strategy-patterns.md
      - Inspect and compare backtests: inspect-backtest-results.md
      - Troubleshoot a backtest: troubleshoot-backtests.md
      - Use the local HTTP API: use-local-api.md
  - Concepts:
      - Backtesting basics: backtesting-basics.md
  - Reference:
      - TradeLang strategy language v1: language-spec.md
      - Indicators: indicators.md
      - Execution semantics: execution-semantics.md
      - Candle data: candle-data.md
      - Command line: cli.md
      - Results and artifacts: results.md
      - Local HTTP API: local-api.md
  - Contribute:
      - Build and publish the docs: publishing.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Exclude local planning notes when building from a development checkout.
exclude_docs: |
  /README.md
  /api-contract.md
  /architecture.md
  /architecture-decisions/
  /backlog-validation.md
  /data-contracts.md
  /implementation-backlog.md
  /mvp1-plan-audit.md
  /mvp1-release.md
  /next-milestones/
  /plans/
  /requirements.txt
  /risk-register.md
  /test-plan.md
  /ux-flows.md
  /verification-report.md
